name: Editorial HTML escape QA (offline)
on:
  pull_request:
    paths:
      - 'scripts/editorial/draft_html_escape_check.py'
      - 'tests/test_draft_html_escape_check.py'
      - '.github/workflows/editorial-html-escape-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_draft_html_escape_check.py' -v
