name: Build WordPress Plugin ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'survival40-auto/**'
      - 'version.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore plugin source
        run: |
          sha256sum survival40-auto/source.part01 survival40-auto/source.part02 survival40-auto/source.part03 survival40-auto/source.part04 survival40-auto/source.part05 survival40-auto/source.part06 survival40-auto/source.part07
          cat survival40-auto/source.part01 \
              survival40-auto/source.part02 \
              survival40-auto/source.part03 \
              survival40-auto/source.part04 \
              survival40-auto/source.part05 \
              survival40-auto/source.part06 \
              survival40-auto/source.part07 \
            > survival40-auto/source.b64
          base64 -d survival40-auto/source.b64 > survival40-auto/survival40-auto.php.gz
          gunzip -f survival40-auto/survival40-auto.php.gz
          rm -f survival40-auto/source.b64

      - name: Patch plugin to current release
        run: |
          python .github/scripts/patch_plugin_0185.py
          python .github/scripts/patch_planner_0186.py
          python .github/scripts/patch_quality_0187.py

      - name: Diagnose REST output risks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('survival40-auto/survival40-auto.php')
          lines=p.read_text(encoding='utf-8').splitlines()
          pats=[r'\becho\b',r'\bprint\b',r'var_dump',r'print_r',r'wp_die',r'rest_',r'admin_post',r'wp_head',r'wp_footer',r'\?>']
          for i,line in enumerate(lines,1):
              if any(re.search(x,line) for x in pats):
                  lo=max(1,i-2); hi=min(len(lines),i+2)
                  print(f'--- lines {lo}-{hi} ---')
                  for n in range(lo,hi+1): print(f'{n}: {lines[n-1]}')
          PY

      - name: Validate PHP
        run: php -l survival40-auto/survival40-auto.php

      - name: Build ZIP
        run: |
          rm -rf dist
          mkdir -p dist
          zip -r dist/survival40-auto.zip survival40-auto \
            -x "*.DS_Store" "*/.git/*" "*.gz.b64" "*/source.part*"

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Create or update fixed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Survival40 Auto v$VERSION" \
              --notes "Automated build from main. Current plugin version: $VERSION"
          else
            gh release create latest \
              --target main \
              --title "Survival40 Auto v$VERSION" \
              --notes "Automated build from main. Current plugin version: $VERSION"
          fi
          gh release upload latest dist/survival40-auto.zip --clobber

# retry-0186
