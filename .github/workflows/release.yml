name: Build WordPress Plugin ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'survival40-auto/**'
      - 'version.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Enter RELEASE-0.19.21 after reviewing staging validation and backup plan'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: survival40-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore plugin source
        run: |
          sha256sum survival40-auto/source.part01 survival40-auto/source.part02 survival40-auto/source.part03 survival40-auto/source.part04 survival40-auto/source.part05 survival40-auto/source.part06 survival40-auto/source.part07
          cat survival40-auto/source.part01 \
              survival40-auto/source.part02 \
              survival40-auto/source.part03 \
              survival40-auto/source.part04 \
              survival40-auto/source.part05 \
              survival40-auto/source.part06 \
              survival40-auto/source.part07 \
            > survival40-auto/source.b64
          base64 -d survival40-auto/source.b64 > survival40-auto/survival40-auto.php.gz
          gunzip -f survival40-auto/survival40-auto.php.gz
          rm -f survival40-auto/source.b64

      - name: Patch plugin to current release
        run: |
          python .github/scripts/patch_plugin_0185.py
          python .github/scripts/patch_planner_0186.py
          python .github/scripts/patch_quality_0187.py
          python .github/scripts/patch_eye_sources_0188.py
          python .github/scripts/patch_dryeye_0189.py
          python .github/scripts/patch_eye_taxonomy_01810.py
          python .github/scripts/patch_photochromic_01811.py
          python .github/scripts/patch_self_research_0190.py
          python .github/scripts/patch_review_guard_0191.py
          python .github/scripts/patch_updater_0192.py
          python .github/scripts/patch_self_heal_0193.py
          python .github/scripts/patch_research_resilience_0194.py
          python .github/scripts/patch_version_sync_0195.py
          python .github/scripts/patch_autopilot_0196.py
          python .github/scripts/patch_evidence_relevance_0197.py
          python .github/scripts/patch_self_updater_0197.py
          python .github/scripts/patch_version_test_0198.py
          python .github/scripts/patch_version_test_0199.py
          python .github/scripts/patch_quality_evidence_01910.py
          python .github/scripts/patch_navigator_01911.py
          python .github/scripts/patch_navigator_alignment_01912.py
          python .github/scripts/patch_navigator_visibility_01913.py
          python .github/scripts/patch_navigator_timing_01914.py
          python .github/scripts/patch_navigator_anchor_01915.py
          python .github/scripts/patch_home_guide_01916.py
          python .github/scripts/patch_brand_separation_01917.py
          python .github/scripts/patch_affiliate_ledger_01918.py
          python .github/scripts/patch_author_display_01919.py
          python .github/scripts/patch_author_update_stability_01920.py

      - name: Stage reviewed affiliate features exactly as validated
        run: |
          python .github/scripts/patch_affiliate_integration_staged.py
          python .github/scripts/patch_affiliate_render_staged.py
          python .github/scripts/patch_affiliate_pipeline_staged.py
          python .github/scripts/patch_affiliate_post_save_staged.py
          python .github/scripts/patch_affiliate_topic_staged.py
          python .github/scripts/patch_affiliate_review_gate_staged.py
          python .github/scripts/patch_affiliate_frontend_staged.py
          python .github/scripts/patch_update_diagnostics_staged.py

      - name: Promote reviewed version markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('survival40-auto/survival40-auto.php')
          s=p.read_text(encoding='utf-8')
          keys=[
            (' * Version: 0.19.20',' * Version: 0.19.21'),
            ("const VERSION = '0.19.20';","const VERSION = '0.19.21';"),
            ('Survival40 Auto v0.19.20</h1>','Survival40 Auto v0.19.21</h1>')
          ]
          for before,after in keys:
            assert s.count(before)==1, 'version marker mismatch: '+before
            s=s.replace(before,after,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify built plugin version surfaces
        run: |
          grep -n "Version:" survival40-auto/survival40-auto.php | head -1
          grep -n "const VERSION" survival40-auto/survival40-auto.php | head -1
          grep -n "Survival40 Auto v" survival40-auto/survival40-auto.php | head -1
          grep -q "Version: 0.19.21" survival40-auto/survival40-auto.php
          grep -q "const VERSION = '0.19.21';" survival40-auto/survival40-auto.php
          grep -q "Survival40 Auto v0.19.21" survival40-auto/survival40-auto.php

      - name: Validate PHP
        run: php -l survival40-auto/survival40-auto.php

      - name: Restore presenter assets
        run: |
          mkdir -p survival40-auto/assets/navigator
          for name in normal explain caution summary; do
            base64 -d ".github/assets/navigator/${name}.webp.b64" > "survival40-auto/assets/navigator/${name}.webp"
            test -s "survival40-auto/assets/navigator/${name}.webp"
          done

      - name: Build candidate-equivalent ZIP
        run: |
          set -eu
          rm -rf dist /tmp/s40-release-package
          mkdir -p dist /tmp/s40-release-package/survival40-auto/assets/navigator
          cp survival40-auto/survival40-auto.php /tmp/s40-release-package/survival40-auto/survival40-auto.php
          cp survival40-auto/assets/navigator/*.webp /tmp/s40-release-package/survival40-auto/assets/navigator/
          (cd /tmp/s40-release-package && zip -qr "$GITHUB_WORKSPACE/dist/survival40-auto.zip" survival40-auto)
          unzip -t dist/survival40-auto.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('dist/survival40-auto.zip') as z:
              expected={'survival40-auto/', 'survival40-auto/survival40-auto.php', 'survival40-auto/assets/', 'survival40-auto/assets/navigator/'}
              expected.update('survival40-auto/assets/navigator/'+name+'.webp' for name in ('normal','explain','caution','summary'))
              assert set(z.namelist()) == expected, z.namelist()
              code=z.read('survival40-auto/survival40-auto.php').decode('utf-8')
              assert "get_option('s40_affiliate_frontend_enabled', 'no') !== 'yes'" in code
              assert ' * Version: 0.19.21' in code
          PY
          sha256sum dist/survival40-auto.zip > dist/SHA256SUMS

      - name: Store release build for review (no public publishing)
        uses: actions/upload-artifact@v4
        with:
          name: survival40-0.19.21-release-review
          path: dist/
          retention-days: 14

      - name: Publish only after explicit manual approval
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE-0.19.21' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(tr -d '\\r\\n' < version.txt)" = '0.19.20'
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Survival40 Auto v0.19.21" --notes "Validated 0.19.21 release build"
          else
            gh release create latest --target main --title "Survival40 Auto v0.19.21" --notes "Validated 0.19.21 release build"
          fi
          gh release upload latest dist/survival40-auto.zip --clobber
