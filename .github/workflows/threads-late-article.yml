name: Shiori Survival40 nightly article introduction
on:
  schedule:
    # 22:00 JST = 13:00 UTC. Actual starts can be delayed by GitHub Actions.
    - cron: '0 13 * * *'
  workflow_dispatch: # Preview-only; publisher is explicitly schedule-gated.
  pull_request:
    paths:
      - '.github/workflows/threads-late-article.yml'
permissions:
  contents: write # Durable duplicate ledger on state/threads-ledger only.
concurrency:
  group: survival40-threads-live
  cancel-in-progress: false
jobs:
  article_intro:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned source: tested JST calendar-day article selection; no WordPress deployment.
          ref: dbc5291990a270fb4d0cef8498d5e5fd36986bee
          persist-credentials: false
      - name: Bound nightly article GET size in immutable pinned source
        # The old 40 full article bodies exceeded a 600 KB response cap
        # on 2026-10-19/20. Only the newest eight are needed at 22:00.
        # Changing the checkout commit is deliberately out of scope.
        env:
          THREADS_ACCESS_TOKEN: ''
          THREADS_USER_ID: ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("scripts/threads/article_feed.py")
          before = file.read_text(encoding="utf-8")
          needle = '"status": "publish", "per_page": 40, "orderby": "date", "order": "desc",'
          replacement = '"status": "publish", "per_page": 8, "orderby": "date", "order": "desc",'
          if before.count(needle) != 1 or "MAX_BYTES = 600_000" not in before:
              raise SystemExit("STOP: pinned article feed source no longer matches reviewed version")
          file.write_text(before.replace(needle, replacement), encoding="utf-8")
          from scripts.threads import article_feed
          import inspect
          source = inspect.getsource(article_feed.fetch_public_posts)
          if '"per_page": 8' not in source or '"per_page": 40' in source:
              raise SystemExit("STOP: bounded fetch not active")
          print("PASS: latest eight only; same HTTPS allowlist, 600 KB cap and publication checks")
          PY
      - name: Run complete offline tests without credentials
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          THREADS_ACCESS_TOKEN: ''
          THREADS_USER_ID: ''
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
      - name: Read today's genuinely published Survival40 article
        if: github.event_name != 'pull_request'
        env:
          THREADS_ACCESS_TOKEN: ''
          THREADS_USER_ID: ''
        run: python3 -m scripts.threads.scheduled_article_publisher prepare
      - name: Send one extra Threads introduction to verified account if scheduled
        if: github.event_name == 'schedule'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.threads.scheduled_article_publisher publish
      - name: Save reviewable copy (never secret)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survival40-nightly-article-intro-${{ github.run_id }}
          path: threads-output/late-article.json
          if-no-files-found: ignore
          retention-days: 14
