name: Shiori Survival40 scheduled Threads posts
on:
  schedule:
    # 08:00/12:00/16:00/20:00 JST: previous-day UTC 23:00, UTC 03:00, 07:00, 11:00.
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    # GitHub Actions can delay/drop top-of-hour runs. A same-hour second
    # trigger is safe: the source locks date+slot in the GitHub ledger
    # BEFORE any Meta request and refuses to repost reserved slots.
    - cron: '20 23 * * *'
    - cron: '20 3 * * *'
    - cron: '20 7 * * *'
    - cron: '20 11 * * *'
  pull_request:
    paths:
      - '.github/workflows/threads-drafts.yml'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Preview only; morning, midday, afternoon or evening'
        required: true
        type: choice
        options: [morning, midday, afternoon, evening]
permissions:
  contents: write
concurrency:
  group: survival40-threads-live
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      THREADS_SLOT: ${{ inputs.slot || 'auto' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Defense in depth: do not provide Meta publication credentials.
      THREADS_ACCESS_TOKEN: ''
      THREADS_USER_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          # Reviewed and offline tested: Shiori copy + single bounded Gemini draft-only HTTP503 retry; publishing unchanged.
          ref: 030e1f8a4cb23550802653b1dbcc97a263473566
          persist-credentials: false
      - name: Checkout immutable reviewed helpful-note source (separate from pinned publisher)
        uses: actions/checkout@v4
        with:
          repository: BL4GS/survival40-auto
          ref: 8189c0900e137c6fcf572b301dfa600a45a09ca2
          path: approved-helpful
          persist-credentials: false
      - name: Unit tests (no credentials)
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
      # Runtime persona guardrails are applied to the pinned checkout (which
      # deliberately does not read main). They do not change the immutable SHA.
      - name: Apply Shiori persona boundaries before drafting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("threads/editorial.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          grooming = config["topic_groups"]["grooming"]
          incompatible = "ひげ剃りの後に保湿するタイミング"
          if incompatible in grooming:
              config["topic_groups"]["grooming"] = [
                  topic for topic in grooming if topic != incompatible
              ]
          # Shiori is a woman writing to readers, not a 40s male narrator.
          # Men-specific experiences may be discussed as general information,
          # never narrated as Shiori's own facial-hair shaving experience.
          persona = ("栞さんは女性。40代男性向けの記事テーマと本人の"
                     "一人称体験は区別し、男性のひげを自分で剃ったと"
                     "いう設定や行動を創作しない。"
                     "栞さんは独身（未婚）。恋愛関係は非公開であり、"
                     "恋人の有無や交際経験を推測・明言・匂わせしない。"
                     "夫・妻・配偶者・恋人・子どもが本人の生活にいる"
                     "という設定や実体験を勝手に作らない。"
                     "独身だからといって一人暮らしや恋人不在とは限らない。"
                     "独身・恋愛を話題にして男性読者の興味をあおらない。"
                     "サイトで妻・夫などの読者視点を扱っても、"
                     "栞さん自身の個人的な体験と混同しない。")
          config["character"]["identity"] += " " + persona
          config["character"]["boundaries"] += " " + persona
          config["voice"]["persona_policy"] += " " + persona
          assert incompatible not in config["topic_groups"]["grooming"]
          path.write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("PASS: Shiori persona (unmarried, relationships private) applied")
          PY
      - name: Prepare Shiori text (first approved, otherwise Gemini or sourced article)
        env:
          # Read-only discovery hint from existing GitHub state branch; optional.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.threads.prepare_schedule
      # The pinned generator intentionally emits no draft when a delayed or
      # duplicate schedule trigger falls outside its approved slot. No draft
      # means no overlay, persona inspection or Meta publication attempt.
      - name: Check whether a draft was prepared (no write)
        id: prepared_draft
        run: |
          if [ -f threads-output/draft.json ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'SKIP: no draft for this schedule trigger; do not publish.'
          fi
      - name: Replace ONE previously approved 16h Thursday draft with a sourced useful note (4-week pilot only)
        if: steps.prepared_draft.outputs.exists == 'true'
        env:
          # No social publishing token and no generative API access for overlay.
          THREADS_ACCESS_TOKEN: ''
          THREADS_USER_ID: ''
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          GITHUB_TOKEN: ''
        run: PYTHONPATH=. python3 approved-helpful/ops/threads/useful_pilot_overlay.py
      # Check independently of the pinned generator code: the checkout uses an
      # approved immutable SHA, so fixes on main alone are not loaded by it.
      # Fail closed rather than silently rewriting or publishing a mismatched persona.
      - name: Reject Shiori gender and relationship persona conflicts
        if: steps.prepared_draft.outputs.exists == 'true'
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          path = pathlib.Path("threads-output/draft.json")
          if not path.is_file():
              raise SystemExit("STOP: no prepared Threads draft")
          draft = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(draft, dict):
              raise SystemExit("STOP: invalid Threads draft format")

          beard = re.compile(r"(?:ひげ|ヒゲ|髭)")
          shave = re.compile(r"(?:剃|そり|シェービング)")
          # Only everyday / fallback posts are checked: sourced article
          # intros can address a spouse's concerns without being Shiori's life.
          relationship = re.compile(
              r"(?:旦那|夫婦|配偶者|嫁|(?<!工)夫(?:の|が|を|と|に|は|も|です)"
              r"|妻(?:の|が|を|と|に|は|も|です)|彼氏|彼女|恋人|元カレ|元カノ"
              r"|交際|婚約|結婚|恋愛|デート|片思い|好きな人|独身|未婚|既婚"
              r"|一人暮らし|ひとり暮らし|独り暮らし"
              r"|子ども|子供|息子|娘|赤ちゃん|妊娠)"
          )
          def persona_conflict(text):
              # Ordinary Shiori posts must never narrate shaving facial hair,
              # even when Japanese omits the implicit first-person subject.
              if not isinstance(text, str):
                  return True
              return bool((beard.search(text) and shave.search(text))
                          or relationship.search(text))

          # Self-checks make the failure mode auditable without calling Gemini.
          assert persona_conflict("ひげを剃ったあとに保湿をしました。")
          assert persona_conflict("ヒゲ剃りをした後にクリームを塗りました。")
          assert persona_conflict("夫と買い物に行きました。")
          assert persona_conflict("彼氏とデートしてきました。")
          assert persona_conflict("一人暮らしなので買い置きは少なめです。")
          assert persona_conflict("子どもと公園に行きました。")
          assert persona_conflict("独身なんです。")
          assert not persona_conflict("ハンドクリームを置き忘れました。")
          assert not persona_conflict("部屋を片づける工夫を考えています。")

          if draft.get("kind") == "everyday" and persona_conflict(draft.get("text")):
              raise SystemExit("STOP: Shiori gender or relationship-setting conflict in everyday post")
          if "fallback_everyday_text" in draft and persona_conflict(draft["fallback_everyday_text"]):
              raise SystemExit("STOP: Shiori gender or relationship-setting conflict in fallback post")
          print("PASS: Shiori gender and private-relationship boundaries respected")
          PY
      - name: Publish once to verified @survival40_jp if scheduled (no retries)
        if: github.event_name == 'schedule' && steps.prepared_draft.outputs.exists == 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.threads.scheduled_publisher
      - name: Save generated text artifact even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survival40-threads-draft-${{ github.run_id }}
          path: threads-output/draft.json
          if-no-files-found: ignore
          retention-days: 14

  offline-helpful-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ''
      THREADS_ACCESS_TOKEN: ''
      THREADS_USER_ID: ''
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
    steps:
      - name: Checkout immutable original 4-slot publishing source
        uses: actions/checkout@v4
        with:
          ref: 030e1f8a4cb23550802653b1dbcc97a263473566
          persist-credentials: false
      - name: Offline pinned publisher and ledger tests
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
      - name: Checkout separately approved helpful content at immutable SHA
        uses: actions/checkout@v4
        with:
          repository: BL4GS/survival40-auto
          ref: 8189c0900e137c6fcf572b301dfa600a45a09ca2
          path: approved-helpful
          persist-credentials: false
      - name: Offline approved useful-post and source-validation tests
        run: |
          cd approved-helpful
          python3 -m unittest discover -s ops/threads -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/threads -p 'test_useful_preview.py' -v
      - name: Checkout PR workflow for static review (never execute PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: workflow-guard-review
          persist-credentials: false
      - name: Assert no-draft gate protects every downstream action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('workflow-guard-review/.github/workflows/threads-drafts.yml').read_text(encoding='utf-8')
          # Restrict assertions to the scheduled job, not this test's own source.
          generate = workflow.split('\n  offline-helpful-contract:', 1)[0]
          assert generate.count("if: steps.prepared_draft.outputs.exists == 'true'") == 2
          assert "if: github.event_name == 'schedule' && steps.prepared_draft.outputs.exists == 'true'" in workflow
          assert "id: prepared_draft" in workflow
          assert "if [ -f threads-output/draft.json ]; then" in workflow
          assert "echo 'exists=false' >> \"$GITHUB_OUTPUT\"" in workflow
          assert "ref: 030e1f8a4cb23550802653b1dbcc97a263473566" in workflow
          assert "ref: 8189c0900e137c6fcf572b301dfa600a45a09ca2" in workflow
          assert "run: python3 -m scripts.threads.scheduled_publisher" in workflow
          print('PASS: no-draft runs skip overlay, persona and publishing; immutable sources unchanged')
          PY
