name: Shiori Survival40 scheduled Threads posts
on:
  schedule:
    # JST 08:00 = UTC previous day 23:00; JST 20:00 = UTC 11:00
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Preview only; morning or evening'
        required: true
        type: choice
        options: [morning, evening]
permissions:
  contents: write
concurrency:
  group: survival40-threads-live
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      THREADS_SLOT: ${{ inputs.slot || 'auto' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Defense in depth: do not provide Meta publication credentials.
      THREADS_ACCESS_TOKEN: ''
      THREADS_USER_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin reviewed persona-first generator and keep 08:00/20:00 as usual; article links move to separate 22:00 workflow.
          ref: 3c19f4b46a48a6748bc27d3ec21bff6b828e1aee
          persist-credentials: false
      - name: Unit tests (no credentials)
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
      - name: Prepare Shiori text (first approved, otherwise Gemini or sourced article)
        env:
          # Read-only discovery hint from existing GitHub state branch; optional.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.threads.prepare_schedule
      - name: Publish once to verified @survival40_jp if scheduled (no retries)
        if: github.event_name == 'schedule'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.threads.scheduled_publisher
      - name: Save generated text artifact even if publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survival40-threads-draft-${{ github.run_id }}
          path: threads-output/draft.json
          if-no-files-found: ignore
          retention-days: 14
