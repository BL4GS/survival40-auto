name: Validate A8 integration (staging only)
on:
  push:
    paths:
      - '.github/workflows/validate-affiliate-staged.yml'
      - '.github/scripts/patch_affiliate_integration_staged.py'
      - '.github/scripts/patch_affiliate_render_staged.py'
      - '.github/scripts/patch_affiliate_pipeline_staged.py'
      - '.github/scripts/patch_affiliate_post_save_staged.py'
      - '.github/scripts/patch_affiliate_topic_staged.py'
      - '.github/scripts/patch_affiliate_review_gate_staged.py'
      - '.github/scripts/test_affiliate_integration_staged.py'
      - '.github/scripts/test_updater_regression_staged.py'
      - '.github/scripts/patch_update_diagnostics_staged.py'
      - '.github/scripts/test_affiliate_php_behavior.php'
      - '.github/scripts/test_affiliate_postsave_behavior.php'
      - 'planning/a8-banner-assets-unified-2026-10.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline validation
        run: python .github/scripts/test_affiliate_integration_staged.py
      - name: Verify updater isolation
        run: python .github/scripts/test_updater_regression_staged.py
      - name: Restore plugin source
        run: |
          sha256sum survival40-auto/source.part01 survival40-auto/source.part02 survival40-auto/source.part03 survival40-auto/source.part04 survival40-auto/source.part05 survival40-auto/source.part06 survival40-auto/source.part07
          cat survival40-auto/source.part01 \
              survival40-auto/source.part02 \
              survival40-auto/source.part03 \
              survival40-auto/source.part04 \
              survival40-auto/source.part05 \
              survival40-auto/source.part06 \
              survival40-auto/source.part07 \
            > survival40-auto/source.b64
          base64 -d survival40-auto/source.b64 > survival40-auto/survival40-auto.php.gz
          gunzip -f survival40-auto/survival40-auto.php.gz
          rm -f survival40-auto/source.b64

      - name: Apply existing production patches
        run: |
          python .github/scripts/patch_plugin_0185.py
          python .github/scripts/patch_planner_0186.py
          python .github/scripts/patch_quality_0187.py
          python .github/scripts/patch_eye_sources_0188.py
          python .github/scripts/patch_dryeye_0189.py
          python .github/scripts/patch_eye_taxonomy_01810.py
          python .github/scripts/patch_photochromic_01811.py
          python .github/scripts/patch_self_research_0190.py
          python .github/scripts/patch_review_guard_0191.py
          python .github/scripts/patch_updater_0192.py
          python .github/scripts/patch_self_heal_0193.py
          python .github/scripts/patch_research_resilience_0194.py
          python .github/scripts/patch_version_sync_0195.py
          python .github/scripts/patch_autopilot_0196.py
          python .github/scripts/patch_evidence_relevance_0197.py
          python .github/scripts/patch_self_updater_0197.py
          python .github/scripts/patch_version_test_0198.py
          python .github/scripts/patch_version_test_0199.py
          python .github/scripts/patch_quality_evidence_01910.py
          python .github/scripts/patch_navigator_01911.py
          python .github/scripts/patch_navigator_alignment_01912.py
          python .github/scripts/patch_navigator_visibility_01913.py
          python .github/scripts/patch_navigator_timing_01914.py
          python .github/scripts/patch_navigator_anchor_01915.py
          python .github/scripts/patch_home_guide_01916.py
          python .github/scripts/patch_brand_separation_01917.py
          python .github/scripts/patch_affiliate_ledger_01918.py
          python .github/scripts/patch_author_display_01919.py
          python .github/scripts/patch_author_update_stability_01920.py

      - name: Stage advertising changes without releasing
        run: python .github/scripts/patch_affiliate_integration_staged.py
      - name: Stage reviewed banner renderer (no active hook)
        run: python .github/scripts/patch_affiliate_render_staged.py
      - name: Stage generated-post proposal integration
        run: python .github/scripts/patch_affiliate_pipeline_staged.py
      - name: Stage post-save proposal integration
        run: python .github/scripts/patch_affiliate_post_save_staged.py
      - name: Stage conservative article topic classification
        run: python .github/scripts/patch_affiliate_topic_staged.py
      - name: Stage campaign and item review gate
        run: python .github/scripts/patch_affiliate_review_gate_staged.py
      - name: Stage passive updater diagnostics
        run: python .github/scripts/patch_update_diagnostics_staged.py
      - name: PHP syntax
        run: php -l survival40-auto/survival40-auto.php
      - name: Execute PHP behavior checks for proposed ads
        run: php .github/scripts/test_affiliate_php_behavior.php
      - name: Execute post-save behavior checks
        run: php .github/scripts/test_affiliate_postsave_behavior.php
      - name: Install isolated WordPress test instance
        run: |
          set -eu
          curl -fsSL https://wordpress.org/latest.tar.gz -o /tmp/wordpress.tar.gz
          mkdir -p /tmp/s40-wp
          tar -xzf /tmp/wordpress.tar.gz -C /tmp/s40-wp --strip-components=1
          php -l /tmp/s40-wp/wp-includes/plugin.php
          php -l /tmp/s40-wp/wp-includes/meta.php
      - name: Boot isolated WordPress with SQLite and WP-CLI
        run: |
          set -eux
          cd /tmp/s40-wp
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
          mkdir -p wp-content
          curl -fsSL https://downloads.wordpress.org/plugin/sqlite-database-integration.latest-stable.zip -o /tmp/sqlite.zip
          unzip -q /tmp/sqlite.zip -d wp-content/plugins
          cp wp-content/plugins/sqlite-database-integration/db.copy wp-content/db.php
          cat > wp-config.php <<'PHP'
          <?php
          define('DB_NAME','s40_test');
          define('DB_USER','unused');
          define('DB_PASSWORD','unused');
          define('DB_HOST','localhost');
          define('DB_CHARSET','utf8mb4');
          define('DB_COLLATE','');
          define('AUTH_KEY','test');
          define('SECURE_AUTH_KEY','test');
          define('LOGGED_IN_KEY','test');
          define('NONCE_KEY','test');
          define('AUTH_SALT','test');
          define('SECURE_AUTH_SALT','test');
          define('LOGGED_IN_SALT','test');
          define('NONCE_SALT','test');
          define('WP_DEBUG',true);
          define('DISABLE_WP_CRON',true);
          define('AUTOMATIC_UPDATER_DISABLED',true);
          define('WP_AUTO_UPDATE_CORE',false);
          $table_prefix='wp_';
          if (!defined('ABSPATH')) define('ABSPATH', __DIR__ . '/');
          require_once ABSPATH . 'wp-settings.php';
          PHP
          php /tmp/wp-cli.phar core install --url=http://localhost --title="S40 staging" --admin_user=runner --admin_password=runner-only --admin_email=runner@example.test --skip-email --allow-root
          php /tmp/wp-cli.phar plugin activate sqlite-database-integration --allow-root
          php /tmp/wp-cli.phar post create --post_type=post --post_status=draft --post_title="プロテインの飲み方" --porcelain --allow-root > /tmp/s40-post-id
          php /tmp/wp-cli.phar post get "$(cat /tmp/s40-post-id)" --field=post_status --allow-root | grep -qx draft
      - name: Activate staged Survival40 in isolated WordPress
        run: |
          set -eu
          mkdir -p /tmp/s40-wp/wp-content/plugins/survival40-auto
          cp survival40-auto/survival40-auto.php /tmp/s40-wp/wp-content/plugins/survival40-auto/survival40-auto.php
          cd /tmp/s40-wp
          php /tmp/wp-cli.phar plugin activate survival40-auto --allow-root
          php /tmp/wp-cli.phar plugin is-active survival40-auto --allow-root
          POST_ID="$(cat /tmp/s40-post-id)"
          php /tmp/wp-cli.phar post update "$POST_ID" --post_title="プロテインの選び方と飲み方" --allow-root
          php /tmp/wp-cli.phar post meta get "$POST_ID" _s40_affiliate_proposed_ids --format=json --allow-root > /tmp/s40-affiliate-result.json
          python - <<'PY'
          import json
          with open('/tmp/s40-affiliate-result.json') as f: result=json.load(f)
          assert 's00000021719001' in result, result
          print('PASS: real WordPress post save created protein ad proposal')
          PY
          php /tmp/wp-cli.phar post get "$POST_ID" --field=post_status --allow-root | grep -qx draft
      - name: Verify staged ad rendering via real WordPress
        run: |
          set -eu
          cd /tmp/s40-wp
          cat > /tmp/s40-check-ad.php <<'PHP'
          <?php
          $id = (int)trim(file_get_contents('/tmp/s40-post-id'));
          $post = get_post($id);
          if (!$post || $post->post_status !== 'draft') throw new RuntimeException('Original draft was changed');
          global $wp_filter;
          $obj = null;
          foreach (($wp_filter['save_post_post']->callbacks ?? []) as $callbacks) {
            foreach ($callbacks as $entry) {
              $callback = $entry['function'];
              if (is_array($callback) && is_object($callback[0]) && method_exists($callback[0], 's40_affiliate_on_post_saved')) $obj = $callback[0];
            }
          }
          if (!$obj) throw new RuntimeException('Survival40 hook object missing');
          $ref = new ReflectionMethod($obj, 's40_ad_markup_for_post');
          $ref->setAccessible(true);
          $before = $ref->invoke($obj, $id);
          if ($before !== '') throw new RuntimeException('Ad appeared without approval');
          update_post_meta($id,'_s40_affiliate_topic','protein');
          update_post_meta($id,'_s40_affiliate_reviewed','yes');
          update_post_meta($id,'_s40_affiliate_reviewed_program_id','s00000021719001');
          update_post_meta($id,'_s40_affiliate_conditions_verified','yes');
          $approved = $ref->invoke($obj, $id);
          if (!str_contains($approved,'PR・広告') || !str_contains($approved,'rel="nofollow sponsored"') || !str_contains($approved,'width="300"')) {
            throw new RuntimeException('Reviewed banner markup missing');
          }
          update_post_meta($id,'_s40_affiliate_disabled','1');
          if ($ref->invoke($obj,$id) !== '') throw new RuntimeException('Disabled banner still rendered');
          if (get_post($id)->post_status !== 'draft') throw new RuntimeException('Draft was published');
          echo "PASS: no ad before review, banner after review, no ad when disabled; draft retained\n";
          PHP
          php /tmp/wp-cli.phar eval-file /tmp/s40-check-ad.php --allow-root
      - name: Simulate ZIP update of installed plugin and verify activation
        run: |
          set -eu
          cd /tmp/s40-wp
          php /tmp/wp-cli.phar plugin is-active survival40-auto --allow-root
          mkdir -p /tmp/s40-upgrade-package/survival40-auto
          cp wp-content/plugins/survival40-auto/survival40-auto.php /tmp/s40-upgrade-package/survival40-auto/survival40-auto.php
          # Local update package: identical code, no remote release, no version bump.
          (cd /tmp/s40-upgrade-package && zip -qr /tmp/s40-local-update.zip survival40-auto)
          php /tmp/wp-cli.phar plugin install /tmp/s40-local-update.zip --force --allow-root
          php /tmp/wp-cli.phar plugin is-active survival40-auto --allow-root
          php /tmp/wp-cli.phar plugin status survival40-auto --allow-root
          POST_ID="$(cat /tmp/s40-post-id)"
          php /tmp/wp-cli.phar post get "$POST_ID" --field=post_status --allow-root | grep -qx draft
      - name: Simulate genuine version change in isolated WordPress
        run: |
          set -eu
          cd /tmp/s40-wp
          php /tmp/wp-cli.phar plugin is-active survival40-auto --allow-root
          php /tmp/wp-cli.phar plugin get survival40-auto --field=version --allow-root | grep -qx '0.19.20'
          mkdir -p /tmp/s40-version-change/survival40-auto
          cp wp-content/plugins/survival40-auto/survival40-auto.php /tmp/s40-version-change/survival40-auto/survival40-auto.php
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/s40-version-change/survival40-auto/survival40-auto.php')
          s=p.read_text(encoding='utf-8')
          old=' * Version: 0.19.20'
          assert s.count(old)==1
          s=s.replace(old,' * Version: 0.19.21',1)
          p.write_text(s,encoding='utf-8')
          PY
          (cd /tmp/s40-version-change && zip -qr /tmp/s40-version-change.zip survival40-auto)
          php /tmp/wp-cli.phar plugin install /tmp/s40-version-change.zip --force --allow-root
          php /tmp/wp-cli.phar plugin get survival40-auto --field=version --allow-root | grep -qx '0.19.21'
          php /tmp/wp-cli.phar plugin is-active survival40-auto --allow-root
          php /tmp/wp-cli.phar post get "$(cat /tmp/s40-post-id)" --field=post_status --allow-root | grep -qx draft
          echo 'PASS: version changed and plugin remained active in isolated environment'
      - name: Exercise WordPress core Plugin_Upgrader update path
        run: |
          set -eu
          cd /tmp/s40-wp
          mkdir -p /tmp/s40-core-update/survival40-auto
          cp wp-content/plugins/survival40-auto/survival40-auto.php /tmp/s40-core-update/survival40-auto/survival40-auto.php
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/s40-core-update/survival40-auto/survival40-auto.php')
          s=p.read_text(encoding='utf-8')
          assert s.count(' * Version: 0.19.21') == 1
          p.write_text(s.replace(' * Version: 0.19.21',' * Version: 0.19.22',1),encoding='utf-8')
          PY
          (cd /tmp/s40-core-update && zip -qr /tmp/s40-core-update.zip survival40-auto)
          cat > /tmp/s40-core-update-test.php <<'PHP'
          <?php
          require_once ABSPATH.'wp-admin/includes/plugin.php';
          require_once ABSPATH.'wp-admin/includes/class-wp-upgrader.php';
          $plugin='survival40-auto/survival40-auto.php';
          if (!is_plugin_active($plugin)) throw new RuntimeException('Plugin not active before upgrade');
          $updates = get_site_transient('update_plugins');
          if (!is_object($updates)) $updates = new stdClass();
          if (!isset($updates->response) || !is_array($updates->response)) $updates->response = [];
          $updates->response[$plugin] = (object)[
              'slug'=>'survival40-auto',
              'plugin'=>$plugin,
              'new_version'=>'0.19.22',
              'package'=>'file:///tmp/s40-core-update.zip',
              'url'=>'http://localhost/'
          ];
          set_site_transient('update_plugins', $updates);
          $upgrader = new Plugin_Upgrader(new Automatic_Upgrader_Skin());
          $result = $upgrader->upgrade($plugin, ['clear_update_cache'=>false]);
          if (is_wp_error($result)) throw new RuntimeException('Upgrade failed: '.$result->get_error_message());
          if (!$result) throw new RuntimeException('Plugin_Upgrader returned false');
          clearstatcache();
          wp_clean_plugins_cache(true);
          $data=get_plugin_data(WP_PLUGIN_DIR.'/'.$plugin);
          if (($data['Version']??'')!=='0.19.22') throw new RuntimeException('Version mismatch');
          $is_active = is_plugin_active($plugin);
          $active_option = (array)get_option('active_plugins', []);
          echo 'POST_UPGRADE_DIAGNOSTIC '.wp_json_encode([
              'active'=>$is_active,
              'active_option_contains_plugin'=>in_array($plugin,$active_option,true),
              'active_plugins'=>$active_option,
              'version'=>$data['Version']
          ])."\n";
          if (!$is_active) {
              echo "REPRODUCED: direct Plugin_Upgrader call does not preserve activation in this scenario\n";
          } else {
              echo "PASS: WordPress Plugin_Upgrader upgraded version and retained activation\n";
          }
          PHP
          php /tmp/wp-cli.phar eval-file /tmp/s40-core-update-test.php --allow-root
          php /tmp/wp-cli.phar plugin status survival40-auto --allow-root
      - name: Compare WordPress automatic-upgrader activation behavior
        run: |
          set -eu
          cd /tmp/s40-wp
          # Restore active state only in the throwaway test database.
          php /tmp/wp-cli.phar plugin activate survival40-auto --allow-root
          php /tmp/wp-cli.phar option update siteurl http://127.0.0.1:8085 --allow-root
          php /tmp/wp-cli.phar option update home http://127.0.0.1:8085 --allow-root
          php -S 127.0.0.1:8085 -t /tmp/s40-wp >/tmp/s40-loopback-server.log 2>&1 &
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 3 http://127.0.0.1:8085/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8085/ >/dev/null
          mkdir -p /tmp/s40-auto-update/survival40-auto
          cp wp-content/plugins/survival40-auto/survival40-auto.php /tmp/s40-auto-update/survival40-auto/survival40-auto.php
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/s40-auto-update/survival40-auto/survival40-auto.php')
          s=p.read_text(encoding='utf-8')
          assert s.count(' * Version: 0.19.22')==1
          p.write_text(s.replace(' * Version: 0.19.22',' * Version: 0.19.23',1),encoding='utf-8')
          PY
          (cd /tmp/s40-auto-update && zip -qr /tmp/s40-auto-update.zip survival40-auto)
          cat > /tmp/s40-auto-update-test.php <<'PHP'
          <?php
          require_once ABSPATH.'wp-admin/includes/plugin.php';
          require_once ABSPATH.'wp-admin/includes/class-wp-upgrader.php';
          $plugin='survival40-auto/survival40-auto.php';
          if (!is_plugin_active($plugin)) throw new RuntimeException('Inactive before test');
          $updates=get_site_transient('update_plugins');
          if (!is_object($updates)) $updates=new stdClass();
          $updates->response = is_array($updates->response ?? null) ? $updates->response : [];
          $updates->response[$plugin]=(object)[
            'slug'=>'survival40-auto','plugin'=>$plugin,
            'new_version'=>'0.19.23','package'=>'file:///tmp/s40-auto-update.zip',
            'url'=>'http://localhost/'
          ];
          set_site_transient('update_plugins',$updates);
          // The auto-update runner has additional lifecycle handling beyond Plugin_Upgrader.
          // Override the isolated environment's disabled policy for this invocation.
          add_filter('automatic_updater_disabled', '__return_false', 100);
          add_filter('auto_update_plugin', '__return_true', 100);
          $runner=new WP_Automatic_Updater();
          $item=(object)[
            'slug'=>'survival40-auto','plugin'=>$plugin,
            'new_version'=>'0.19.23','package'=>'file:///tmp/s40-auto-update.zip',
            'url'=>'http://localhost/'
          ];
          $events=[];
          $record=function($name) use (&$events,$plugin) {
            $active=(array)get_option('active_plugins',[]);
            $events[]=['event'=>$name,'active'=>in_array($plugin,$active,true)];
          };
          add_action('upgrader_pre_install',function($response) use ($record){$record('pre_install'); return $response;},10,1);
          add_action('upgrader_post_install',function($response) use ($record){$record('post_install'); return $response;},10,1);
          add_action('upgrader_process_complete',function() use ($record){$record('process_complete');},999,0);
          add_filter('pre_update_option_active_plugins',function($value,$old) use (&$events,$plugin) {
            $events[]=['event'=>'active_plugins_option_write','old'=>in_array($plugin,(array)$old,true),'new'=>in_array($plugin,(array)$value,true)];
            return $value;
          },10,2);
          $record('before_auto_update');
          $result=$runner->update('plugin',$item);
          $record('after_auto_update');
          echo 'ACTIVE_STATE_TIMELINE '.wp_json_encode($events)."\\n";
          if (is_wp_error($result)) {
            echo 'AUTO_UPDATER_ERROR '.wp_json_encode([
              'code'=>$result->get_error_code(),
              'message'=>$result->get_error_message(),
              'version'=>get_plugin_data(WP_PLUGIN_DIR.'/'.$plugin)['Version'],
              'active'=>is_plugin_active($plugin),
              'rollback_possible'=>file_exists(WP_PLUGIN_DIR.'/'.$plugin),
            ])."\\n";
            return;
          }
          if (!$result) {
            echo 'AUTO_UPDATE_FALSE_DIAGNOSTIC '.wp_json_encode([
              'disabled_constant'=>defined('AUTOMATIC_UPDATER_DISABLED') ? AUTOMATIC_UPDATER_DISABLED : null,
              'disabled_filter'=>apply_filters('automatic_updater_disabled', false),
              'version'=>get_plugin_data(WP_PLUGIN_DIR.'/'.$plugin)['Version'],
              'active'=>is_plugin_active($plugin),
              'skin_messages'=>isset($runner->skin) ? 'skin_available' : 'not_exposed'
            ])."\\n";
            return;
          }
          wp_clean_plugins_cache(true);
          $data=get_plugin_data(WP_PLUGIN_DIR.'/'.$plugin);
          $active=is_plugin_active($plugin);
          echo 'AUTO_UPDATER_DIAGNOSTIC '.wp_json_encode([
            'version'=>$data['Version'],'active'=>$active,
            'active_option_contains_plugin'=>in_array($plugin,(array)get_option('active_plugins',[]),true)
          ])."\n";
          if ($data['Version']!=='0.19.23') throw new RuntimeException('Unexpected version');
          if (!$active) throw new RuntimeException('Auto updater removed active state');
          PHP
          php /tmp/wp-cli.phar eval-file /tmp/s40-auto-update-test.php --allow-root
          php /tmp/wp-cli.phar plugin status survival40-auto --allow-root
          test -f /tmp/s40-loopback-server.log
      - name: Check no unexpected public publishing hook was added
        run: |
          grep -q "テーマ別広告候補" survival40-auto/survival40-auto.php
          grep -q "s40_ad_markup_for_post" survival40-auto/survival40-auto.php
          grep -q "s40_affiliate_prepare_review" survival40-auto/survival40-auto.php
          grep -q "save_post_post" survival40-auto/survival40-auto.php
          grep -q "s40_affiliate_infer_topic" survival40-auto/survival40-auto.php
          grep -q "s40_affiliate_eligible_for_post" survival40-auto/survival40-auto.php
          grep -q "s40_update_audit_after_upgrade" survival40-auto/survival40-auto.php
          grep -q "s40_affiliate_match_preview" survival40-auto/survival40-auto.php
          grep -q "if (\$id === 's00000022947002') continue;" survival40-auto/survival40-auto.php
