name: Survival40 Threads API Safety Tests
on:
  pull_request:
    paths:
      - 'scripts/threads/**'
      - '.github/workflows/threads-api-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # Credential-free verification of an isolated tested source commit.
          ref: 56f5b6a3fbe626308cb2bfe8d1141a8f4ec2b074
          persist-credentials: false
      - name: Test Threads integration offline, no API secrets
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          THREADS_ACCESS_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
