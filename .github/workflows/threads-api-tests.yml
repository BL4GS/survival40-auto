name: Survival40 Threads API Safety Tests
on:
  pull_request:
    paths:
      - 'scripts/threads/**'
      - '.github/workflows/threads-api-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          # Test immutable candidate; never touch Meta or production ledger.
          ref: c57414fde44054592887ca7d43bbe7b1f12a0571
          persist-credentials: false
      - name: Test Threads integration offline, no API secrets
        env:
          GEMINI_API_KEY: ''
          GOOGLE_API_KEY: ''
          THREADS_ACCESS_TOKEN: ''
          GITHUB_TOKEN: ''
        run: python3 -m unittest discover -s scripts/threads -p 'test_*.py' -v
