name: Survival40 Editorial Idea One-Time Smoke (NO PUBLISH)
on:
  push:
    paths:
      - '.github/workflows/editorial-topics-smoke.yml'
permissions:
  contents: read
jobs:
  one-time-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      THREADS_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate a single set of article concepts (no publishing)
        run: python3 -m editorial_intelligence.plan
      - name: Archive proposal for review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s40-editorial-smoke-${{ github.run_id }}
          path: editorial-output/
          if-no-files-found: ignore
          retention-days: 7
