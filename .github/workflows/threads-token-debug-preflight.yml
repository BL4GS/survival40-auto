name: Threads token scopes and expiry (READ ONLY)
on:
  pull_request:
    paths:
      - "scripts/threads/token_preflight.py"
      - "scripts/threads/test_token_preflight.py"
      - ".github/workflows/threads-token-debug-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test token response validation without secrets
        env:
          THREADS_ACCESS_TOKEN: ""
          THREADS_USER_ID: ""
        run: python3 -m unittest scripts.threads.test_token_preflight -v
  inspect-token:
    if: github.event_name == 'workflow_dispatch'
    needs: offline-safety-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect user token using official Threads API (GET only)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python3 -m scripts.threads.token_preflight
