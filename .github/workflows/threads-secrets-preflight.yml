name: Threads saved credentials preflight (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm GitHub Secrets belong to @survival40_jp
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          token = os.getenv("THREADS_ACCESS_TOKEN", "").strip()
          expected_id = os.getenv("THREADS_USER_ID", "").strip()
          if len(token) < 12:
              sys.exit("FAIL: THREADS_ACCESS_TOKEN secret is missing or invalid.")
          if not re.fullmatch(r"[0-9]{1,30}", expected_id):
              sys.exit("FAIL: THREADS_USER_ID secret is missing or not numeric.")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("Unexpected redirect")

          request = urllib.request.Request(
              "https://graph.threads.net/me?fields=id%2Cusername",
              method="GET",
              headers={
                  "Accept": "application/json",
                  "Authorization": "Bearer " + token,
              },
          )
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                  if response.status != 200:
                      sys.exit("FAIL: Threads /me did not return 200.")
                  profile = json.loads(response.read(8192).decode("utf-8"))
          except urllib.error.HTTPError as exc:
              sys.exit("FAIL: Threads API HTTP " + str(exc.code) + ". No post created.")
          except (urllib.error.URLError, TimeoutError, ValueError, UnicodeError, RuntimeError):
              sys.exit("FAIL: Cannot safely verify credentials. No post created.")

          if (not isinstance(profile, dict)
              or str(profile.get("id", "")) != expected_id
              or str(profile.get("username", "")).lstrip("@").casefold() != "survival40_jp"):
              sys.exit("FAIL: Saved Threads user ID or username does not match token. No post created.")

          print("PASS: Both GitHub Secrets match @survival40_jp.")
          print("No post created. No access token or user ID was printed.")
          print("NOTE: Content-publishing permission and token expiry were NOT verified.")
          summary = os.getenv("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Threads preflight: PASS\n\n")
                  out.write("Saved token and user ID both resolve to **@survival40_jp**.\n\n")
                  out.write("Only GET /me was called. **No post created.**\n\n")
                  out.write("Publishing scope and token expiry still require separate verification.\n")
          PY
