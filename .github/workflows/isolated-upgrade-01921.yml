name: Survival40 0.19.21 Upgrade + Rollback (ISOLATED, NO RELEASE)
on:
  pull_request:
    paths:
      - '.github/workflows/isolated-upgrade-01921.yml'
      - '.github/scripts/test_01921_upgrade_fixture.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_REPO: BL4GS/survival40-auto
      S40_ISOLATED_REHEARSAL: ephemeral-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct EXACT existing 0.19.21 candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/release.yml').read_text().splitlines()
          for name in ('Restore plugin source','Patch plugin to current release',
                       'Stage reviewed affiliate features exactly as validated',
                       'Promote reviewed version markers'):
              marker='      - name: '+name
              assert lines.count(marker)==1,name
              i=lines.index(marker)+1
              assert lines[i]=='        run: |'
              script=[]
              for line in lines[i+1:]:
                  if line and not line.startswith('          '): break
                  script.append(line[10:] if line else '')
              subprocess.run(['bash','-euo','pipefail','-c','\n'.join(script)+'\n'],check=True)
              print('PASS: reconstructed',name)
          PY
          php -l survival40-auto/survival40-auto.php
      - name: Package candidate with original Shiori images
        run: |
          set -euo pipefail
          mkdir -p /tmp/s40-package/survival40-auto/assets/navigator dist
          cp survival40-auto/survival40-auto.php /tmp/s40-package/survival40-auto/
          for name in normal explain caution summary; do
            base64 -d ".github/assets/navigator/$name.webp.b64" > "/tmp/s40-package/survival40-auto/assets/navigator/$name.webp"
          done
          (cd /tmp/s40-package && zip -qr "$GITHUB_WORKSPACE/dist/survival40-auto-0.19.21-rc.zip" survival40-auto)
          unzip -tq dist/survival40-auto-0.19.21-rc.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/survival40-auto-0.19.21-rc.zip') as z:
              code=z.read('survival40-auto/survival40-auto.php').decode('utf-8')
              assert ' * Version: 0.19.21' in code
              assert "const VERSION = '0.19.21';" in code
              assert "get_option('s40_affiliate_frontend_enabled', 'no') !== 'yes'" in code
              assert len([x for x in z.namelist() if x.endswith('.webp')])==4
          PY
          sha256sum dist/survival40-auto-0.19.21-rc.zip > dist/SHA256SUMS
      - name: Verify published known-good 0.19.20 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < version.txt)" = '0.19.20'
          test "$(gh release view latest --json name --jq '.name')" = 'Survival40 Auto v0.19.20'
          mkdir -p /tmp/s40-known-good
          gh release download latest --pattern survival40-auto.zip --dir /tmp/s40-known-good
          unzip -tq /tmp/s40-known-good/survival40-auto.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/s40-known-good/survival40-auto.zip') as z:
              code=z.read('survival40-auto/survival40-auto.php').decode('utf-8')
              assert ' * Version: 0.19.20' in code
          PY
      - name: Start standalone WordPress + SQLite on runner
        run: |
          set -euo pipefail
          curl -fsSL https://wordpress.org/latest.tar.gz -o /tmp/s40-wp.tar.gz
          mkdir -p /tmp/s40-wp
          tar -xzf /tmp/s40-wp.tar.gz -C /tmp/s40-wp --strip-components=1
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/s40-wp-cli.phar
          mkdir -p /tmp/s40-wp/wp-content/plugins
          curl -fsSL https://downloads.wordpress.org/plugin/sqlite-database-integration.latest-stable.zip -o /tmp/s40-sqlite.zip
          unzip -q /tmp/s40-sqlite.zip -d /tmp/s40-wp/wp-content/plugins
          cp /tmp/s40-wp/wp-content/plugins/sqlite-database-integration/db.copy /tmp/s40-wp/wp-content/db.php
          cat > /tmp/s40-wp/wp-config.php <<'PHP'
          <?php
          define('DB_NAME','s40_isolated_01921');
          define('DB_USER','test');
          define('DB_PASSWORD','test');
          define('DB_HOST','localhost');
          define('DB_CHARSET','utf8mb4');
          define('DB_COLLATE','');
          define('AUTH_KEY','localtest');
          define('SECURE_AUTH_KEY','localtest');
          define('LOGGED_IN_KEY','localtest');
          define('NONCE_KEY','localtest');
          define('AUTH_SALT','localtest');
          define('SECURE_AUTH_SALT','localtest');
          define('LOGGED_IN_SALT','localtest');
          define('NONCE_SALT','localtest');
          define('WP_DEBUG',true);
          define('DISABLE_WP_CRON',true);
          define('AUTOMATIC_UPDATER_DISABLED',true);
          define('WP_AUTO_UPDATE_CORE',false);
          $table_prefix='wp_';
          if (!defined('ABSPATH')) define('ABSPATH', __DIR__ . '/');
          require_once ABSPATH . 'wp-settings.php';
          PHP
          cd /tmp/s40-wp
          php /tmp/s40-wp-cli.phar core install --url=http://localhost --title="S40 isolated" --admin_user=runner --admin_password=local-test-only --admin_email=runner@example.test --skip-email --allow-root
          php /tmp/s40-wp-cli.phar plugin activate sqlite-database-integration --allow-root
          php /tmp/s40-wp-cli.phar plugin install /tmp/s40-known-good/survival40-auto.zip --activate --allow-root
          php /tmp/s40-wp-cli.phar plugin is-active survival40-auto --allow-root
          test "$(php /tmp/s40-wp-cli.phar plugin get survival40-auto --field=version --allow-root)" = '0.19.20'
      - name: Prepare 23 public and 16 draft synthetic posts with ad/automation OFF
        run: |
          set -euo pipefail
          cd /tmp/s40-wp
          S40_REHEARSAL_PHASE=seed php /tmp/s40-wp-cli.phar eval-file "$GITHUB_WORKSPACE/.github/scripts/test_01921_upgrade_fixture.php" --allow-root
          S40_REHEARSAL_PHASE=snapshot php /tmp/s40-wp-cli.phar eval-file "$GITHUB_WORKSPACE/.github/scripts/test_01921_upgrade_fixture.php" --allow-root > /tmp/s40-before.json
          python3 -m json.tool /tmp/s40-before.json > /dev/null
      - name: Upgrade 0.19.20 to staged 0.19.21 and compare all safety data
        run: |
          set -euo pipefail
          cd /tmp/s40-wp
          php /tmp/s40-wp-cli.phar plugin install "$GITHUB_WORKSPACE/dist/survival40-auto-0.19.21-rc.zip" --force --activate --allow-root
          php /tmp/s40-wp-cli.phar plugin is-active survival40-auto --allow-root
          test "$(php /tmp/s40-wp-cli.phar plugin get survival40-auto --field=version --allow-root)" = '0.19.21'
          S40_REHEARSAL_PHASE=snapshot php /tmp/s40-wp-cli.phar eval-file "$GITHUB_WORKSPACE/.github/scripts/test_01921_upgrade_fixture.php" --allow-root > /tmp/s40-after-upgrade.json
          cmp /tmp/s40-before.json /tmp/s40-after-upgrade.json
          echo 'PASS: 0.19.20 to 0.19.21; all 39 articles and OFF settings preserved'
      - name: Reinstall old 0.19.20 and prove safe plugin-only rollback
        run: |
          set -euo pipefail
          cd /tmp/s40-wp
          php /tmp/s40-wp-cli.phar plugin install /tmp/s40-known-good/survival40-auto.zip --force --activate --allow-root
          php /tmp/s40-wp-cli.phar plugin is-active survival40-auto --allow-root
          test "$(php /tmp/s40-wp-cli.phar plugin get survival40-auto --field=version --allow-root)" = '0.19.20'
          S40_REHEARSAL_PHASE=snapshot php /tmp/s40-wp-cli.phar eval-file "$GITHUB_WORKSPACE/.github/scripts/test_01921_upgrade_fixture.php" --allow-root > /tmp/s40-after-rollback.json
          cmp /tmp/s40-before.json /tmp/s40-after-rollback.json
          echo 'PASS: 0.19.21 to 0.19.20; all 39 articles and OFF settings preserved'
      - name: Ensure no released version was changed
        run: |
          test "$(cat version.txt)" = '0.19.20'
          git diff --exit-code -- .github/workflows/release.yml version.txt
      - name: Upload isolated test ZIP only (never public release)
        uses: actions/upload-artifact@v4
        with:
          name: survival40-0.19.21-upgrade-test-${{ github.run_id }}
          path: dist/
          retention-days: 14
