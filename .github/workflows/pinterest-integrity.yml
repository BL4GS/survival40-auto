name: Pinterest RSS card integrity (read only)
on:
  pull_request:
    paths:
      - 'scripts/pinterest/**'
      - 'pinterest/**'
      - 'assets/pinterest/auto/**'
      - '.github/workflows/pinterest-image-rss.yml'
      - '.github/workflows/pinterest-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --quiet 'Pillow==11.3.0'
      - name: Run RSS builder and integrity gate unit tests
        run: |
          python3 -m unittest discover -s scripts/pinterest -p 'test_*.py' -v
          python3 -m py_compile scripts/pinterest/build_rss.py scripts/pinterest/verify_static_feed.py
      - name: Check checked-in RSS and original image cards (no network)
        run: python3 -m scripts.pinterest.verify_static_feed
